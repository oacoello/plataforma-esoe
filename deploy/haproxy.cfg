global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout queue 5s
    retries 2

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend entrada
    bind :8080
    default_backend plataforma

backend plataforma
    balance leastconn
    option redispatch
    option forwardfor
    option httpchk GET /api/ready
    http-check expect status 200
    server-template instancia 1-8 esoe-web:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr none
