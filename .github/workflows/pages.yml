name: Publicar vista web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      activo: ${{ steps.pages.outputs.activo }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "activo=true" >> "$GITHUB_OUTPUT"
          else
            echo "activo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages no esta activo. Activelo en Settings > Pages > Source: GitHub Actions."
          fi

  construir:
    needs: comprobar
    if: needs.comprobar.outputs.activo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Configuracion publica de inicio de sesion
        env:
          CLERK_LLAVE_PUBLICA: pk_test_ZmFpci1sYW1wcmV5LTg3MDkuY2xlcmsuYWNjb3VudHMuZGV2JA
          CLERK_DOMINIO: fair-lamprey-8709.clerk.accounts.dev
        run: |
          printf '{"autenticacion":{"proveedor":"clerk","llavePublica":"%s","dominio":"%s"},"integraciones":false}\n' "$CLERK_LLAVE_PUBLICA" "$CLERK_DOMINIO" > public/config-publica.json
          cat public/config-publica.json
      - name: Version en los archivos de la vista
        run: |
          VERSION="${GITHUB_SHA::12}"
          sed -i -E "s#(src=\"js/[a-z0-9-]+\.js)\"#\1?v=${VERSION}\"#g; s#(href=\"css/[a-z0-9-]+\.css)\"#\1?v=${VERSION}\"#g" public/index.html
          grep -c "?v=${VERSION}" public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
